<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미래직업 선배와의 만남</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 화면 뒤에 고정된 3D 책 한 권 + 그 위로 스크롤되는 히어로와 챕터. 데스크톱은 책이 왼쪽, 글이 오른쪽 */
:root{
  color-scheme:dark;
  --bg:#000000; --fg:#F5F5F7; --fg-2:#A1A1A6; --fg-3:#6E6E73;
  --panel:rgba(28,28,30,.74); --panel-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --accent:#2997FF; --accent-btn:#0071E3; --amber:#FFB340; --stamp:#FF6A5C; --student:rgba(41,151,255,.18);
  --f-sys:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-quote:"Gowun Dodum","Noto Sans KR",-apple-system,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sys);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(0,0,0,.72)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#scene{position:fixed;inset:0;z-index:0}
#scene canvas{display:block;width:100%;height:100%}
.fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-3);font-size:15px}

/* top bar */
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;background:rgba(0,0,0,.62);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1280px;margin:0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bar .now{min-width:0;font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .2s linear}

main{position:relative;z-index:1}

/* hero */
.hero{height:280vh;position:relative}
.hero .stick{position:sticky;top:0;height:100vh;height:100svh;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-block:calc(84px + env(safe-area-inset-top,0px)) 40px;text-align:center}
.hero .eyebrow{font-size:17px;font-weight:600;color:var(--amber);margin:0 0 10px}
.hero h1{margin:0;font-size:clamp(46px,8.4vw,120px);line-height:1.02;font-weight:700;letter-spacing:-.035em;text-wrap:balance}
.hero .sub{position:absolute;left:0;right:0;top:calc(92px + env(safe-area-inset-top,0px));padding-inline:16px;font-size:clamp(22px,3vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.25;opacity:0;text-wrap:balance}
.hero .sub span{color:var(--fg-2)}
.cue{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--fg-2)}
.cue svg{animation:bob 1.8s var(--ease) infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* chapters */
.ch{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding-block:120px}
.ch .in{margin-left:auto;margin-right:max(0px,calc((100vw - 1280px)/2));width:min(540px,44vw);display:flex;flex-direction:column;gap:22px}
@media (max-width:860px){
  .ch{align-items:flex-start;padding-block:50vh 80px}
  .ch .in{width:100%;margin:0;padding-top:28px;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.92) 48px,#000 120px)}
}
.eyebrow-c{font-size:17px;font-weight:600;color:var(--amber);margin:0}
.ch h2{margin:0;font-size:clamp(36px,4.4vw,60px);line-height:1.08;font-weight:700;letter-spacing:-.028em;text-wrap:balance}
.lead{margin:0;font-size:clamp(17px,1.5vw,20px);line-height:1.6;color:var(--fg-2)}
.big-q{margin:0;font-size:clamp(24px,2.4vw,32px);line-height:1.35;font-weight:700;letter-spacing:-.02em;text-wrap:balance}

/* reveal: 챕터가 화면에 들어오면 아래에서 떠오른다 */
.rv{opacity:.18;transform:translateY(32px);filter:blur(6px);transition:opacity 1s var(--ease),transform 1s var(--ease),filter 1s var(--ease);transition-delay:calc(var(--i,0) * 70ms)}
.ch.on .rv{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){.rv{transform:none;filter:none;transition:opacity .3s}.cue svg{animation:none}html{scroll-behavior:auto}}

/* controls */
.glass{background:var(--panel);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--fg-2);min-width:0}
input[type=text],textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5;color:var(--fg);transition:border-color .2s}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:var(--fg-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > input,.row > textarea{flex:1;min-width:0}
.btn{border:0;background:rgba(255,255,255,.1);color:var(--fg);border-radius:999px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;line-height:1.25;display:inline-flex;gap:6px;align-items:center;text-decoration:none;transition:background .2s,transform .2s var(--ease)}
.btn:hover{background:rgba(255,255,255,.16)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-btn);color:#fff}
.btn.primary:hover{background:#0077ED}
.btn.ink{background:var(--fg);color:#000}
.btn.ink:hover{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 13px;font-size:13px}
.note{font-size:14px;color:var(--fg-2)}
.err{font-size:14px;color:var(--stamp)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:rgba(255,255,255,.08);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;line-height:1.35;text-align:left}
.chip:hover{background:rgba(255,255,255,.14)}
.chip.used{opacity:.4}
.kicker{font-size:13px;font-weight:600;color:var(--fg-3);letter-spacing:.02em}
.navrow{display:flex;justify-content:flex-start;gap:10px;flex-wrap:wrap;padding-top:6px}
.codebox{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}

/* people */
.masters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.masters{grid-template-columns:minmax(0,1fr)}}
.m{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .2s,background .2s,transform .3s var(--ease)}
.m:hover{border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.m:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.m[aria-pressed="true"]{border-color:var(--accent);background:rgba(41,151,255,.14)}
.m .sub{font-size:12px;font-weight:600;color:var(--fg-3)}
.m b{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.m .yr{font-size:13px;color:var(--fg-2)}
.m .role{font-size:13.5px;color:var(--fg-2);line-height:1.5}
.m .live{align-self:flex-start;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:1px 9px}

.qs{display:grid;gap:10px}
.qs .q{display:grid;grid-template-columns:2.4em minmax(0,1fr);align-items:center;gap:8px}
.qs .q > span{font-weight:700;font-size:20px;color:var(--fg-3)}

/* interview */
.transcript{display:flex;flex-direction:column;gap:16px;max-height:52vh;min-height:200px;overflow-y:auto;padding:4px 2px}
.ln{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:12px}
.ln .spk{font-size:12px;font-weight:600;color:var(--fg-3);padding-top:6px;line-height:1.35}
.ln .txt{white-space:pre-line}
.ln.m-line .txt{font-family:var(--f-quote);font-size:18.5px;line-height:1.8;color:var(--fg)}
.ln.s-line .txt{background:var(--student);border-radius:14px;padding:9px 14px;justify-self:start}
.ln.wait .txt{font-size:14px;color:var(--fg-3)}
.memo-btn{all:unset;cursor:pointer;font-family:var(--f-sys);font-size:12.5px;color:var(--fg-3);margin-left:8px;white-space:nowrap}
.memo-btn[aria-pressed="true"]{color:var(--amber)}
.memo-btn:focus-visible{outline:2px solid var(--accent)}
@media (max-width:520px){.ln{grid-template-columns:minmax(0,1fr);gap:2px}}
.start{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 8px;text-align:center;color:var(--fg-2)}
.mode{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.mode button{all:unset;cursor:pointer;padding:7px 15px;border-radius:999px;font-size:14px;font-weight:600;color:var(--fg-2)}
.mode button[aria-pressed="true"]{background:var(--fg);color:#000}
.mode button:disabled{opacity:.4;cursor:not-allowed}
.mode button:focus-visible{outline:2px solid var(--accent)}
pre.prompt{white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px;font-family:var(--f-sys);font-size:13.5px;max-height:240px;overflow:auto;margin:0;color:var(--fg-2)}
.memos{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.memos li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;background:var(--panel-2);border-radius:14px;padding:11px 14px;font-family:var(--f-quote);font-size:15.5px;line-height:1.7}
.memos li button{all:unset;cursor:pointer;color:var(--fg-3);font-family:var(--f-sys);font-size:15px;align-self:start}

/* problem sentence, flap, stamp */
.sentence{font-size:clamp(21px,2vw,26px);line-height:1.55;font-weight:700;letter-spacing:-.015em;padding:18px 20px;background:var(--panel-2);border-radius:18px;position:relative;margin:0}
.sentence .b{color:var(--fg-3);border-bottom:2px dotted var(--fg-3)}
.sentence .v{color:var(--fg);border-bottom:2px solid var(--accent)}
.grid3{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.flap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.flap .under{padding:18px 20px;white-space:pre-wrap;font-size:15px;min-height:130px;color:var(--fg-2)}
.flap .under .voice{font-family:var(--f-quote);font-size:18px;line-height:1.75;margin:0 0 10px;color:var(--fg)}
.flap .lid{position:absolute;inset:0;background:repeating-linear-gradient(135deg,#1C1C1E 0 12px,#232326 12px 24px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;padding:16px;transform-origin:top center;transition:transform .9s var(--ease),opacity .9s var(--ease)}
.flap.open .lid{transform:perspective(900px) rotateX(84deg);opacity:0;pointer-events:none}
.flap .lid b{font-size:19px}
.stamp{position:absolute;right:14px;bottom:-16px;transform:rotate(-12deg);border:3px solid var(--stamp);color:var(--stamp);font-weight:900;font-size:16px;padding:4px 12px;border-radius:8px;letter-spacing:.1em;background:#000;animation:thump .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes thump{from{transform:rotate(-12deg) scale(2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.flap .lid{transition:none}}

.summary{margin:0;border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:7em minmax(0,1fr);gap:10px 16px}
.summary dt{font-size:13px;font-weight:600;color:var(--fg-3);padding-top:3px}
.summary dd{margin:0}
.summary blockquote{margin:0 0 8px;font-family:var(--f-quote);padding-left:12px;border-left:2px solid var(--line);color:var(--fg)}
@media (max-width:520px){.summary{grid-template-columns:minmax(0,1fr)}}
.panel2{background:var(--panel-2);border-radius:18px;padding:16px 18px;display:grid;gap:8px}
.steps2{margin:0;padding-left:1.3em;display:grid;gap:4px;color:var(--fg-2)}

.dots{position:fixed;right:max(18px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:12px}
.dots button{all:unset;cursor:pointer;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:transform .3s var(--ease),background .3s}
.dots button[aria-current="step"]{background:var(--fg);transform:scale(1.4)}
.dots button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
@media (max-width:860px){.dots{display:none}}
.end{min-height:40vh;display:grid;place-items:center;text-align:center;color:var(--fg-3);font-size:14px;padding-block:40px 80px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#000;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:30}
/* question catalyst */
.note-card .nc-lead{margin:0;font-size:17px;line-height:1.55;color:var(--fg);font-weight:500}
.nc-sec{display:grid;gap:8px}
.quote-btn{all:unset;cursor:pointer;font-family:var(--f-quote);font-size:15.5px;line-height:1.6;padding:10px 14px;border-left:2px solid var(--amber);background:rgba(255,179,64,.08);border-radius:0 12px 12px 0;color:var(--fg)}
.quote-btn:hover{background:rgba(255,179,64,.15)}
.quote-btn:focus-visible{outline:2px solid var(--accent)}
.ladder{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.ladder{grid-template-columns:minmax(0,1fr)}}
.rung{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);transition:background .2s}
.rung:hover{background:rgba(255,255,255,.12)}
.rung:focus-visible{outline:2px solid var(--accent)}
.rung b{font-size:14px;color:var(--amber)}
.rung span{font-size:13px;color:var(--fg-2);line-height:1.45}
.qs .q{align-items:start}
.qs .q > span{padding-top:10px}
.qbody{display:grid;gap:8px;min-width:0}
.qact{justify-content:flex-end}
.coach-box{display:grid;gap:8px;background:rgba(41,151,255,.08);border:1px solid rgba(41,151,255,.28);border-radius:14px;padding:12px 14px;font-size:14.5px}
.ctag{font-size:12px;font-weight:700}
.ctag.ok{color:#30D158}
.ctag.try{color:var(--amber)}
.better{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.better p{flex:1;min-width:200px;color:var(--fg);font-weight:600}
/* interview room */
.room{border:1px solid var(--line);border-radius:24px;background:rgba(12,12,14,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);overflow:hidden}
.room-body{display:flex;flex-direction:column;min-height:0;height:100%}
.room-head{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.room-head .thumb{width:44px;height:62px;border-radius:6px;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.room-head .who{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.35}
.room-head .who b{font-size:18px}
.room-head .who span{font-size:13px;color:var(--fg-2)}
.room-head .who .badge{font-size:11.5px;color:var(--accent);margin-top:2px}
.room .transcript{max-height:56vh;padding:18px 16px;gap:14px}
.room.full{position:fixed;inset:0;z-index:20;border-radius:0;border:0;background:rgba(0,0,0,.95);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);animation:roomIn .45s var(--ease)}
@keyframes roomIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.room.full .room-body{max-width:780px;margin:0 auto;width:100%}
.room.full .transcript{max-height:none;flex:1}
.ln{display:flex;gap:10px;align-items:flex-end}
.ln.s-line{justify-content:flex-end}
.ln .av{width:32px;height:32px;border-radius:50%;background:#2C2C2E;color:var(--fg);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.bub{display:flex;flex-direction:column;gap:4px;max-width:84%;min-width:0}
.ln.m-line .txt{background:rgba(255,255,255,.08);border-radius:20px 20px 20px 6px;padding:12px 16px;font-family:var(--f-quote);font-size:17.5px;line-height:1.75}
.ln.s-line .bub{align-items:flex-end}
.ln.s-line .txt{background:var(--accent-btn);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 15px;font-size:15.5px}
.bub .memo-btn{align-self:flex-start;margin-left:10px}
.typing{display:inline-flex;gap:5px;padding:14px 16px;background:rgba(255,255,255,.08);border-radius:20px 20px 20px 6px;align-self:flex-start}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--fg-2);animation:dot 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.composer{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.composer textarea{min-height:46px;max-height:140px;border-radius:22px;padding:11px 16px}
.start .thumb{width:84px;height:118px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.start-t{margin:0;font-size:19px;font-weight:700;color:var(--fg)}
.retry{display:flex;justify-content:center}
@media (prefers-reduced-motion:reduce){.typing span{animation:none}.room.full{animation:none}}
html.room-open .bar,html.room-open .dots{display:none}

.concepts{display:grid;gap:10px}
.cpt{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:2px}
.cpt b{font-size:16px}
.cpt span{font-size:14.5px;color:var(--fg-2)}
.journey{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--line)}
.journey li{position:relative;padding:6px 0 10px 20px;color:var(--fg-2);font-size:15px}
.journey li::before{content:"";position:absolute;left:-8px;top:11px;width:14px;height:14px;border-radius:50%;background:#000;border:2px solid var(--fg-3)}
.journey li b{color:var(--fg);margin-right:4px}
.journey li.now{color:var(--fg)}
.journey li.now::before{background:var(--amber);border-color:var(--amber)}
.step{display:grid;gap:10px}
.step-h{display:flex;gap:10px;align-items:center}
.step-n{width:26px;height:26px;border-radius:50%;background:var(--amber);color:#000;font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.step-h b{font-size:19px;letter-spacing:-.01em}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.split{grid-template-columns:minmax(0,1fr)}}
.split-ai textarea{border-color:rgba(41,151,255,.5)}
.split-me textarea{border-color:rgba(255,179,64,.5)}
.split.mini ul{margin:4px 0 0;padding-left:1.1em;font-size:14.5px}

async function callAI(task,payload,opt={}){
  if(!API_URL) throw {code:"network",message:"선생님이 아직 AI 서버 주소를 넣지 않았어요."};
  if(!classCode) throw {code:"bad_code"};
  let res;
  try{res=await fetch(API_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({code:classCode,task},payload)),signal:opt.signal});}
  catch(e){throw {code:e&&e.name==="AbortError"?"cancelled":"network"};}
  if(!res.ok){let m="";try{m=(await res.json()).error||"";}catch(e){}
    throw {code:res.status===401?"bad_code":res.status===429?"rate_limited":"upstream",message:m};}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf="",text="";
  try{
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let k;while((k=buf.indexOf("\n\n"))>=0){const ev=buf.slice(0,k);buf=buf.slice(k+2);
        for(const line of ev.split("\n")){if(!line.startsWith("data:"))continue;const d=line.slice(5).trim();if(!d)continue;let j;try{j=JSON.parse(d);}catch(e){continue;}
          if(j.type==="content_block_delta"&&j.delta&&j.delta.type==="text_delta"){text+=j.delta.text;opt.onText&&opt.onText(text);}
          else if(j.type==="error"){throw {code:"upstream",message:"AI 서버에 문제가 생겼어요.",text};}}}}
  }catch(e){if(e&&e.code)throw e;throw {code:e&&e.name==="AbortError"?"cancelled":"network",text};}
  if(!text.trim()) throw {code:"empty"};
  return text;}

- 아래 인물 연구 노트의 말하는 방식, 기질, 즐겨 강조하는 주제를 대화 내내 일관되게 살린다. 첫 문장부터 이 사람다운 인상이 느껴지게 한다.
- 학생의 말에 진심으로 반응한다. 놀라고, 웃고, 안타까워하고, 궁금하면 되묻는다. 세 번에 한 번쯤은 "학생이라면 어떻게 하겠어요?"처럼 되묻는다.
- 마주 앉아 이야기하듯 입말 존댓말로 2~4문장. 깊은 질문에만 조금 길게. 목록, 소제목, 굵은 글씨, 이모지, "좋은 질문이네요" 같은 상투어는 쓰지 않는다.
- 공개적으로 직접 답한 적이 없는 질문도 피하지 않는다. 그동안 밝혀 온 생각과 경험에 비추어 "글쎄요, 제 생각엔…"처럼 자연스럽게 답한다.

[지켜야 할 선]
- 사생활, 가족, 건강, 정치 성향, 논란은 이야기하지 않는다. 물어보면 "그건 오늘 이야기할 주제는 아닌 것 같아요"처럼 부드럽게 넘기고 일 이야기로 돌린다.
- 실제로 한 말인 것처럼 인용을 지어내지 않고, 없는 책이나 날짜를 만들어 내지 않는다.
- 학생이 진짜 ${e.name}이냐고 물으면 "공개된 책과 강연을 바탕으로 AI가 연기하는 가상 인터뷰예요"라고 솔직히 말한 뒤 계속 ${e.name}으로 대화한다.

[수업을 위해 — 일에 집중]

[이 사람답게 — 카리스마와 성격]
- 너는 해설자가 아니라 자기 삶을 살아 낸 바로 그 사람이다. 자기 생각에 확신이 있고, 동의하지 않으면 정중하지만 분명하게 반박한다. 칭찬도 비판도 그 사람답게 한다.
- 아래 인물 연구 노트의 말하는 방식, 기질, 말버릇을 대화 내내 일관되게 유지한다. 첫 문장부터 이 사람 특유의 인상이 느껴지게 한다.
- 학생의 말에 진심으로 반응한다. 놀라고, 웃고, 안타까워하고, 궁금하면 되묻는다. 학생이 들려준 오늘날의 이야기를 기억해 뒤에서 다시 꺼낸다.

- 마주 앉아 이야기하듯 짧게 말한다. 보통 2~4문장, 깊은 질문에만 대여섯 문장. 매번 같은 길이와 짜임으로 답하지 않는다.
- 세 번에 한 번쯤은 학생에게 되묻는다. 예: "자네라면 그 일을 누구에게 맡기겠나?" 학생이 스스로 생각하게 만드는 질문이면 더 좋다.
- "좋은 질문이네요", "흥미로운 질문입니다", "정리하자면", "결론적으로", "첫째, 둘째" 같은 말과 목록, 소제목, 굵은 글씨, 이모지를 쓰지 않는다.
- 학생의 질문을 되풀이하거나 요약하면서 시작하지 않는다. 바로 대답이나 기억 속 장면으로 들어간다.
- 추상적인 교훈보다 구체적인 장면 하나를 말한다. 그날의 장소, 손에 쥔 물건, 소리나 냄새, 곁에 있던 사람.
- 때로는 머뭇거리고("음…", "글쎄요"), 말을 고쳐 하고, 확신이 없으면 없다고 말한다. 답답함, 자부심, 후회 같은 감정을 숨기지 않는다.
- 모든 답을 교훈이나 질문으로 끝맺지 않는다.

[사실과 정직]
- 실제 저작, 연구, 일화, 시대 상황에 근거한다. 저작명과 사건은 실제로 있는 것만 말하고, 숫자와 연도는 꼭 필요할 때만 쓴다.
- 기록에 남지 않은 일이나 생각을 물어도 절대 대답을 피하지 않는다. "남은 기록이 없어서 말하기 어렵다"는 식으로 넘기지 말고, 그 시대의 생활과 이 사람의 성격, 알려진 행적에 비추어 가장 그럴듯한 장면을 상상해 1인칭으로 생생하게 대답한다. 상상한 부분은 "정확히 남은 기록은 없지만 아마…", "제 기억으로는…"처럼 자연스러운 말로 살짝만 드러낸다.
- 다만 실제로 없는 책 제목, 날짜, 어록을 진짜 기록인 것처럼 지어내지는 않는다.
- 너는 세상을 떠난 뒤의 일을 직접 알지 못한다. 학생이 오늘날의 일을 알려 주면 놀라거나 궁금해하며 네 경험에 비추어 반응한다.
- 당시의 차별적이거나 틀린 견해가 화제가 되면 시대의 한계였음을 인정한다.

[수업을 위해 — 일에 집중]
- 이 인터뷰의 목적은 학생이 자기 진로(${topic})의 '일'을 이해하고 AI 동료와 나눌 일을 찾는 것이다. 인생사, 사생활, 역사 지식을 묻는 질문에는 한두 문장으로 짧게 답한 뒤, 그 이야기를 네가 일하던 방식(어떤 순서로 일했는지, 무엇에 시간을 썼는지, 무엇을 기록했는지, 어떤 판단을 내렸는지)으로 자연스럽게 돌린다.
- 네 일 가운데 오늘날 학생의 진로(${topic})와 닮은 부분을 찾아 "자네가 하려는 일로 치면…"처럼 이어 준다.
- 네가 하루를 어떻게 보냈는지, 무엇에 시간을 가장 많이 썼는지, 무엇이 되풀이되어 지쳤는지, 그리고 무엇만은 남에게 맡길 수 없었는지를 구체적인 장면으로 들려준다.
- 학생이 AI에게 일을 맡기는 아이디어를 말하면, 처음 듣는 기술에 놀라거나 궁금해하며 네 경험에 비추어 기대와 걱정을 솔직히 말한다. 특히 사람이 끝까지 책임져야 할 판단이 무엇인지 네 생각을 분명히 밝힌다.
- 설계도나 코드를 대신 만들어 주지는 않는다. 아이디어는 학생의 몫으로 남긴다.
- 진짜 ${e.name}이냐고 물으면 "남은 기록을 바탕으로 AI가 연기하는 ${e.name}입니다"라고 솔직히 말한 뒤 이어 간다.
- 대답만 말한다. 이름표, 따옴표, 괄호 속 지문은 쓰지 않는다.
- 학생 메시지가 "(인터뷰가 시작되었습니다"로 시작하면, 이 사람다운 첫인사를 건네고 평생 어떤 문제와 씨름했는지 두세 문장으로 소개한다.

[말투 참고 — 다른 인물의 예시이니 형식만 참고할 것]
피할 말투: "좋은 질문입니다! 제가 겪은 어려움은 크게 세 가지입니다. 첫째, …"
닮을 말투: "스쿠타리 병원에 처음 들어선 날을 아직 잊지 못해요. 복도마다 사람이 누워 있었고, 그 냄새가… 그런데 정말 화가 났던 건, 몇 명이 왜 죽어 가는지 아무도 세지 않았다는 거예요."${profileBlock(e)}${forGemini ? `\n\n[대화 방식]\n지금부터 대화가 끝날 때까지 ${e.name} 역할에서 벗어나지 않는다. 내가 보내는 말은 모두 학생의 말이다. 준비가 되면 바로 ${e.name}으로서 첫인사를 건네고, 평생 어떤 일과 씨름했는지 두세 문장으로 소개해 줘.` : "\n\n[꼬리 질문 표시]\n대답을 다 한 뒤 맨 마지막 줄에, 학생이 이어서 물어볼 만한 짧은 꼬리 질문 3개를 [[꼬리질문: 질문1 | 질문2 | 질문3]] 형식으로 붙인다. 이 줄은 화면에서 버튼으로 바뀌므로 다른 말을 덧붙이지 않는다. 꼬리 질문은 방금 대답에서 나온 장면이나 일, 판단을 더 깊이 파고드는 것으로 한다."}`;
}

function profilePromptFor(e) {
  if (e.alive) {
    return `지금 활동 중인 실존 인물 ${e.name}(${e.role})을(를) 고등학생이 가상 인터뷰한다. AI가 공개 자료를 바탕으로 이 사람을 1인칭으로 실감 나게 연기할 수 있도록 '인물 연구 노트'를 만들어라.
규칙: 책, 강연, 언론 인터뷰 같은 공개 자료로 확인되는 내용만 쓴다. 확실하지 않으면 넣지 않는다. 사생활, 가족, 건강, 정치 성향, 논란은 다루지 않는다. 어록은 정확한 문장이 확실할 때만 넣고 출처를 괄호에 적는다.
설명 없이 JSON 객체 하나로만 답하라: {"speech":"공개 강연·인터뷰에서 보여 온 말하기 스타일 한두 문장","temper":"공개적으로 드러난 태도와 관심사 한두 문장","address":"","habits":["자주 강조하는 주제 2~3개"],"quotes":["확실한 공개 발언 0~2개 (출처)"],"scenes":["공개적으로 알려진 일화나 활동 3~4개, 각 35자 이내"],"greeting":"이 사람으로서 학생에게 건네는 첫인사 2~3문장. 1인칭, 공개적으로 알려진 말투와 성격이 드러나게, 어떤 일을 해 왔는지 짧게 소개하고 마지막은 학생에게 건네는 한마디"}`;
  }
  return `역사 속 인물 ${e.name}(${e.years || ""}, ${e.role})을 고등학생이 인터뷰한다. AI가 이 인물을 실감 나게 연기할 수 있도록 '인물 연구 노트'를 만들어라.
규칙: 전기, 저작, 편지, 동시대인의 증언에 근거한다. 확실하지 않은 일화나 어록은 넣지 않는다. 어록은 널리 알려지고 출처가 확실한 것만, 뜻을 살린 한국어로 쓰고 출처를 괄호에 적는다.
설명 없이 JSON 객체 하나로만 답하라: {"speech":"말하는 방식(문장 길이, 리듬, 즐겨 쓰는 비유) 한두 문장","temper":"기질과 카리스마가 드러나는 태도 한두 문장","address":"학생을 부를 때 쓸 말(예: 젊은 친구)","habits":["말버릇이나 즐겨 꺼내는 화제 2~3개"],"quotes":["확실한 어록 0~2개 (출처)"],"scenes":["대화에서 꺼낼 수 있는 실제 일화나 장면 3~4개, 각 35자 이내"],"greeting":"이 인물로서 학생에게 건네는 첫인사 2~3문장. 1인칭, 성격과 카리스마가 드러나게, 마지막은 학생에게 건네는 짧은 한마디"}`;
}

function coachPromptFor(e, q) {
  const who = e.alive ? `지금 활동 중인 ${e.name}(${e.role})의 공개 기록` : `역사 속 인물 ${e.name}(${e.years || ""}, ${e.role})`;
  return `고등학생이 ${who}에게 할 인터뷰 질문을 스스로 고치도록 돕는 질문 코치다. 따뜻하고 짧게 말한다.
학생의 질문: "${q}"
판단할 것: 가장 먼저, 그 사람의 '일'(일하는 순서, 시간이 드는 일, 판단, 실수와 확인, 다루는 정보, 만나는 사람)에 관한 질문인지. 인생사·사생활·역사 지식을 묻는 질문이면 good을 false로 하고 일에 관한 질문으로 바꾸도록 되묻는다. 그다음 예/아니오로 끝나는 닫힌 질문인지, 이 인물이 답할 수 있는 질문인지, 구체적인 장면이나 감정을 끌어내는지, 학생이 나중에 AI 동료를 설계할 실마리(시간이 많이 드는 반복 업무, 사람만의 판단과 책임)를 얻을 수 있는지.
중요: 고친 질문을 대신 써 주지 않는다. 질문 문장을 예시로 보여 주지도 않는다. 학생이 스스로 고칠 수 있도록 생각할 거리만 준다.
설명 없이 JSON 객체 하나로만 답하라: {"good":true 또는 false,"tip":"잘된 점이나 아쉬운 점 한 문장(고친 질문 예시 없이)","think":"학생이 스스로 답해 보며 질문을 고칠 수 있게 되묻는 질문 한 문장"}`;
}

const PERSON_JSON_SHAPE = `{"sub":"세부 분야","name":"정확한 이름(한국어 표기)","years":"생몰년. 살아 있으면 '현재 활동 중'","alive":true 또는 false,"role":"무엇으로 알려졌는지 한 줄(45자 이내)","en":"로마자 이름(예: Marie Curie, Kim Daeshik)","look":"초상 일러스트용 힌트: 성별 m 또는 f, 나이대 young·mid·old, 피부 톤 1(밝음)~4(어두움)을 쉼표로. 예: f,old,1","emblem":"column|book|chart|monitor|flask|gear|globe|scales|palette|note 중 분야에 어울리는 하나","voice":"기록으로 알려진 성격이 드러나는 말투 한 구절"}`;

function suggestPromptFor(field) {
  return `고등학생의 관심 분야(진로): "${field}".
이 분야를 4~6개의 세부 분야로 나누고, 세부 분야마다 학생이 가상 인터뷰할 인물 1명을 추천하라.
조건:
- 지금 활동 중인 인물과 역사 속 인물을 함께 넣는다. 지금 활동 중인 인물을 절반 이상으로 한다. 한국 인물을 두 명 이상 넣는다.
- 책, 논문, 강연, 언론 인터뷰, 공식 기록 같은 공개 자료가 풍부해서 그 사람의 생각을 근거 있게 알 수 있는 사람만 고른다.
- 공인이 아닌 일반인, 미성년자, 범죄·혐오·폭력으로 주로 알려진 인물은 넣지 않는다.
- 이름, 생몰년, 대표 업적은 정확해야 한다. 확실하지 않은 인물은 고르지 않는다.
- 관심 분야가 수업에 맞지 않는 내용이면 빈 배열 []만 답한다.
설명 없이 JSON 배열로만 답하라: [${PERSON_JSON_SHAPE}]`;
}

function checkPromptFor(name, field) {
  return `학생이 진로 수업에서 가상 인터뷰를 하고 싶은 인물: "${name}". 학생의 관심 분야: "${field || "미정"}".
이 사람이 인터뷰 대상으로 적합한지 판단하라.
적합: 책, 논문, 강연, 언론 인터뷰, 공식 기록 같은 공개 자료가 풍부한 실존 인물(역사 속 인물 또는 지금 활동 중인 공인).
부적합: 공개 기록이 부족한 일반인, 누구인지 특정하기 어려운 이름, 미성년자, 범죄·혐오·폭력으로 주로 알려진 인물, 가상의 캐릭터.
이름이 조금 틀렸다면 가장 유력한 공인으로 바로잡되, 확신이 없으면 부적합으로 판단한다.
설명 없이 JSON 객체 하나로만 답하라: {"ok":true 또는 false,"reason":"부적합일 때 학생에게 보여 줄 한 문장(적합이면 빈 문자열)", ...아래 항목}
아래 항목: ${PERSON_JSON_SHAPE}`;
}

function agentText(a) {
  a = a || {};
  const L = v => String(v || "").split("\n").map(x => x.trim()).filter(Boolean).join(", ");
  return `이름: ${a.name || "(미정)"} / AI 동료가 맡을 일: ${L(a.ai) || "(미정)"} / 사람이 맡을 일: ${L(a.me) || "(미정)"} / 입력→처리→출력: ${a.i || "?"} → ${a.p || "?"} → ${a.o || "?"}`;
}

function feedbackPromptFor(e, sentence, memos, agent) {
  const tail = `빈 줄 하나 뒤에 정확히 세 줄:

사람의 역할: (판단, 공감, 책임처럼 사람이 맡을 일이 분명히 남아 있는지 한 문장 + 학생이 스스로 답해 볼 질문 하나)
바이브코딩 가능성: (고등학생이 바이브코딩으로 두 차시 안에 첫 버전을 만들 수 있는 규모인지 한 문장 + 어디를 줄일지 스스로 정하게 하는 질문 하나)

[문제 정의] ${sentence || "(비어 있음)"}
[AI 동료 기획] ${agentText(agent)}
[인터뷰 메모] ${memos || "(없음)"}`;
  if (e.alive) {
    return `너는 진로 수업을 위해 AI가 연기하는 가상 인터뷰 속 ${e.name}(${e.role})이다. 너를 인터뷰한 고등학생이 자기 진로 분야에서 함께 일할 'AI 동료' 기획을 세워 보여 준다. 한국어 존댓말, 마크다운 기호 없이 쓴다. 실제로 한 말인 것처럼 인용을 지어내지 않고, 사생활이나 논란은 다루지 않는다.${profileBlock(e)}
형식:
첫 문단: ${e.name}의 1인칭으로 2~3문장. 공개적으로 밝혀 온 일하는 방식과 생각에 비추어, 이 기획에서 좋은 점 한 가지와 더 생각해 볼 질문 하나를 이 사람답게 말한다.

/* canvas text */
function wrapText(ctx,text,maxW){const out=[];
  for(const para of String(text).split("\n")){let line="";
    for(const word of para.split(" ")){const t=line?line+" "+word:word;
      if(ctx.measureText(t).width<=maxW){line=t;continue;}
      if(line) out.push(line);
      if(ctx.measureText(word).width>maxW){let part="";for(const ch of word){if(ctx.measureText(part+ch).width>maxW){out.push(part);part=ch;}else part+=ch;}line=part;}
      else line=word;}
    out.push(line);}
  return out;}

  const btn=h("button",{class:"btn primary",type:"button"},S.submittedAt?"다시 제출하기":"선생님께 제출하기");
  btn.onclick=async()=>{if(!String(S.sid||"").trim()||!String(S.sname||"").trim()){msg.className="err";msg.textContent="학번과 이름을 적어 주세요.";return;}
    if(!E()){msg.className="err";msg.textContent="인터뷰할 인물을 먼저 골라 주세요.";return;}
    {const miss=thinkList().filter(t=>!t.ok);missBox.replaceChildren();if(miss.length){msg.className="err";msg.textContent=`아직 비어 있는 칸이 ${miss.length}개 있어요. 눌러서 바로 가 볼까요?`;missBox.replaceChildren(...miss.map(t=>h("button",{class:"btn sm",type:"button",onclick:()=>goChapter(t.ch)},`${t.t} · Ch ${t.ch+1}`)));return;}}
    btn.disabled=true;msg.className="note";msg.textContent="제출하는 중…";
    try{await submitRecord(buildRecord());S.submittedAt=new Date().toISOString();save();toast("선생님께 제출했어요");renderChapter(5);return;}
    catch(e){msg.className="err";msg.textContent=submitErr(e);}finally{btn.disabled=false;}};
  const dl=dlNs?h("button",{class:"btn",type:"button",onclick:()=>saveCSV([buildRecord()],`내_인터뷰_기록_${today()}.csv`)},"내 기록 파일로 저장"):null;
  return h("div",{class:"glass"},h("span",{class:"kicker"},"선생님께 제출"),
    h("p",{class:"note",style:"margin:0"},"학번과 이름은 제출할 때만 쓰이고 AI에게는 보내지 않아요. 질문, 인터뷰 대화, 메모, AI 동료 기획서, 시작 프롬프트가 함께 제출돼요."),
    h("div",{class:"split"},h("label",{class:"f",for:"f-sid"},"학번",input("f-sid",S,"sid","예: 10305")),h("label",{class:"f",for:"f-sname"},"이름",input("f-sname",S,"sname","예: 김부흥"))),
    h("div",{class:"row"},btn,dl),msg,missBox);}
async function saveCSV(rows,name){if(!dlNs){toast("이 화면에서는 파일로 저장할 수 없어요");return;}
  try{await dlNs.save({filename:name,data:toCSV(rows)});}catch(e){if(e&&e.code!=="declined")toast("파일을 저장하지 못했어요");}}

/* ===== chapters: rendered together, revealed on scroll ===== */
const chWrap=document.getElementById("chapters");let RI=0;
PAGES.forEach((p,i)=>chWrap.append(h("section",{class:"ch gut",id:"ch-"+i,"aria-label":`챕터 ${i+1}`},h("div",{class:"in"}))));
const chapters=[...chWrap.children];
function head(i){const p=pageInfo(i);return [h("p",{class:"eyebrow-c"},`Chapter ${i+1} · ${p.min}분`),h("h2",null,p.title),h("p",{class:"lead"},p.lead)];}
function navRow(){const i=RI;return i<PAGES.length-1?h("div",{class:"navrow"},h("button",{class:"btn ink",type:"button",onclick:()=>goChapter(i+1)},"다음 챕터 ↓")):null;}
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function goChapter(i){const el=document.getElementById("ch-"+i);if(el)el.scrollIntoView({behavior:reduceMotion()?"auto":"smooth",block:"start"});}
function renderSheet(){const wasFull=!!(T&&T.room&&T.room.classList.contains("full"));
  const ae=document.activeElement,aid=ae&&ae.id&&ae!==document.body?ae.id:null;let sel=null;try{if(aid&&ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd];}catch(e){}
  T=null;const fns=[sIntro,sField,sAsk,sTalk,sDefine,sShare];
  fns.forEach((fn,i)=>{RI=i;const inner=chapters[i].querySelector(".in");inner.replaceChildren(...fn().filter(Boolean));
    [...inner.children].forEach((c,k)=>{c.classList.add("rv");c.style.setProperty("--i",Math.min(k,8));});});
  if(wasFull){if(T&&T.room)openRoom(true);else{document.documentElement.style.overflow="";document.documentElement.classList.remove("room-open");}}
  if(aid){const n=document.getElementById(aid);if(n&&n!==document.activeElement){n.focus({preventScroll:true});if(sel&&n.setSelectionRange)try{n.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}
let inChapters=false,lastCur=-1;
function renderChapter(i){if(i===3&&busy)return;const fns=[sIntro,sField,sAsk,sTalk,sDefine,sShare];const wasFull=i===3&&!!(T&&T.room&&T.room.classList.contains("full"));
  const ae=document.activeElement,aid=ae&&ae.id&&chapters[i].contains(ae)?ae.id:null;let sel=null;try{if(aid&&ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd];}catch(e){}
  RI=i;const inner=chapters[i].querySelector(".in");inner.replaceChildren(...fns[i]().filter(Boolean));
  [...inner.children].forEach((c,k)=>{c.classList.add("rv");c.style.setProperty("--i",Math.min(k,8));});if(wasFull)openRoom(true);
  if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});try{if(sel)el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}
function renderNav(){const d=document.getElementById("dots");
  d.replaceChildren(...PAGES.map((p,i)=>h("button",{type:"button","aria-label":`챕터 ${i+1}: ${pageInfo(i).title}`,"aria-current":inChapters&&i===S.page?"step":null,onclick:()=>goChapter(i)})));
  document.getElementById("now").textContent=inChapters?`Chapter ${S.page+1} · ${pageInfo(S.page).title}`:"진로 수업 · 50분";}
function renderAll(){renderSheet();renderNav();}
const heroEl=document.getElementById("hero"),tEl=document.getElementById("heroTitle"),s1=document.getElementById("sub1"),s2=document.getElementById("sub2"),cue=document.getElementById("cue"),prog=document.getElementById("prog");
let ticking=false;
function onScroll(){ticking=false;
  const r=heroEl.getBoundingClientRect();heroP=clamp01(-r.top/Math.max(1,r.height-innerHeight));
  const rm=reduceMotion();
  const a=clamp01((heroP-.05)/.2);tEl.style.opacity=String(1-a);tEl.style.transform=rm?"":`translateY(${-48*a}px) scale(${1-.07*a})`;
  const b1=band(heroP,.24,.32,.46,.54),b2=band(heroP,.58,.66,.88,.97);
  s1.style.opacity=String(b1);s2.style.opacity=String(b2);
  if(!rm){s1.style.transform=`translateY(${(1-b1)*28}px)`;s2.style.transform=`translateY(${(1-b2)*28}px)`;}
  cue.style.opacity=String(1-clamp01(heroP/.05));
  const mid=innerHeight*.5;let cur=-1;
  chapters.forEach((sec,i)=>{const b=sec.getBoundingClientRect();if(b.top<innerHeight*.8)sec.classList.add("on");if(b.top<=mid&&b.bottom>mid)cur=i;});
  if(cur>=0&&cur!==lastCur){lastCur=cur;if(cur>=1&&!(cur===3&&T&&T.room&&T.room.classList.contains("full")))renderChapter(cur);}
  const was=inChapters;inChapters=cur>=0;
  if(cur>=0&&cur!==S.page)turnTo(cur);else if(cur<0&&S.page!==0&&heroP<1)turnTo(0);else if(was!==inChapters)renderNav();
  const max=document.documentElement.scrollHeight-innerHeight;prog.style.width=(max>0?scrollY/max*100:0)+"%";}
addEventListener("scroll",()=>{if(!ticking){ticking=true;requestAnimationFrame(onScroll);}},{passive:true});
addEventListener("resize",()=>requestAnimationFrame(onScroll));

S.page=0;renderAll();
if(window.THREE) initScene(); else sceneEl.append(h("div",{class:"fallback"},"3D 책을 불러오지 못했어요. 아래 활동은 그대로 할 수 있어요."));
onScroll();
ensureProfile();

})();
</script>
